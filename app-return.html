<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment received — Glow by Grace</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2a1a14">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --cream: #f7f0e7; --espresso: #2a1a14; --gold: #c49a5a; --gold-2: #e2c08a; --muted: #8a7366; --white: #fffdfa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px 16px; background: var(--cream); color: var(--espresso); font-family: Manrope, system-ui, sans-serif; text-align: center; }
    .card { width: min(440px, 100%); background: var(--white); border-radius: 24px; padding: 34px 26px; box-shadow: 0 20px 50px -25px rgba(42,26,20,.45); }
    .check { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--gold-2), var(--gold)); font-size: 1.8rem; font-weight: 800; }
    .eyebrow { font-size: .72rem; letter-spacing: .28em; text-transform: uppercase; font-weight: 800; color: #6b4636; }
    h1 { font-family: "Bodoni Moda", Georgia, serif; font-weight: 400; font-size: 2.2rem; margin: 10px 0 12px; line-height: 1.05; }
    p { color: var(--muted); line-height: 1.65; margin: 0; }
  </style>
</head>
<body>
  <main class="card">
    <div class="check" aria-hidden="true">✓</div>
    <div class="eyebrow">Glow by Grace app</div>
    <h1>Payment received</h1>
    <p>You can close this page — the Glow by Grace app will show your confirmed order.</p>
  </main>
</body>
</html>
